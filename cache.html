<!doctype html>
<html lang="es" manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Santi · Instalador de Caché PS4 14.00</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: radial-gradient(circle at 50% 20%, #151c2e 0%, #07090e 100%);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 38px 30px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(234, 179, 8, 0.08);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
    }
    h1 span {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #message {
      color: #94a3b8;
      font-size: 14px;
      margin: 18px 0 14px;
      min-height: 1.5em;
    }
    #track {
      height: 12px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      margin: 14px 0;
      position: relative;
    }
    #bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%);
      box-shadow: 0 0 14px #fbbf24;
      border-radius: 9999px;
      transition: width .2s ease-out;
    }
    #percent {
      font-size: 20px;
      font-weight: 800;
      color: #fbbf24;
      margin-bottom: 22px;
    }
    .tip {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 22px;
    }
    .btn {
      display: inline-block;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 12px;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      color: #07090e;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);
      transition: all .2s;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(245, 158, 11, 0.45);
    }
    footer {
      margin-top: 24px;
      color: #64748b;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">💾 MODO OFFLINE 100%</div>
    <h1>Instalador de <span>Caché PS4</span></h1>
    <p id="message">Verificando archivos offline...</p>
    <div id="track"><div id="bar"></div></div>
    <div id="percent">0%</div>

    <div class="tip">
      💡 Una vez llegue al <b>100%</b>, apretá <b>OPTIONS</b> en tu joystick y agregá esta página a <b>Marcadores</b> para abrirla siempre sin internet ni PC.
    </div>

    <div>
      <a class="btn" href="index.html">🚀 Abrir Lanzador GoldHEN</a>
    </div>

    <footer>
      Santi PS4 Hub · Basado en mansoor0x & Afterglow
    </footer>
  </div>

  <script>
    (function () {
      var msg = document.getElementById("message");
      var pct = document.getElementById("percent");
      var bar = document.getElementById("bar");
      var app = window.applicationCache;

      function setStatus(text, value) {
        msg.textContent = text;
        if (typeof value === "number") {
          value = Math.max(0, Math.min(100, value));
          bar.style.width = value + "%";
          pct.textContent = value + "%";
        } else {
          pct.textContent = "";
        }
      }

      if (!app) {
        setStatus("La caché offline no es soportada por este navegador.", null);
        return;
      }

      app.addEventListener("checking", function () {
        setStatus("Verificando archivos en la nube...", null);
      }, false);
      app.addEventListener("downloading", function () {
        setStatus("Descargando exploit a la memoria de tu PS4...", 0);
      }, false);
      app.addEventListener("progress", function (event) {
        if (event.lengthComputable && event.total > 0) {
          setStatus("Guardando exploit en tu PS4...", Math.round(event.loaded / event.total * 100));
        } else {
          setStatus("Descargando archivos a la PS4...", null);
        }
      }, false);
      app.addEventListener("cached", function () {
        setStatus("¡Caché guardada con éxito en tu PS4!", 100);
      }, false);
      app.addEventListener("noupdate", function () {
        setStatus("Tu PS4 ya tiene la última versión guardada.", 100);
      }, false);
      app.addEventListener("updateready", function () {
        try { app.swapCache(); } catch (e) {}
        setStatus("Caché actualizada correctamente.", 100);
      }, false);
      app.addEventListener("obsolete", function () {
        setStatus("Manifiesto obsoleto. Recargá la página.", null);
      }, false);
      app.addEventListener("error", function () {
        setStatus("La caché ya está lista o no hay conexión.", 100);
      }, false);
    })();
  </script>
</body>
</html>
