      border-radius: 50%;
      background: #fbbf24;
      box-shadow: 0 0 12px #fbbf24;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }

    .links {
